version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Primary Database: PostgreSQL 16 with PostGIS, TimescaleDB, pgvector
  # -------------------------------------------------------------
  timescale-postgis-db:
    image: timescale/timescaledb-ha:pg16
    container_name: arogya_timescale_postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arogya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogya_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-arogyasaathi_db}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arogya_user} -d ${POSTGRES_DB:-arogyasaathi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis Message Broker & State Store
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arogya_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 3. MinIO S3-Compatible Object Store (Audio Consents & Recordings)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: arogya_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-arogya_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-arogya_minio_secret_key_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # -------------------------------------------------------------
  # 4. FastAPI Gateway & AI Orchestration Server
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arogya_fastapi
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: timescale-postgis-db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/app
    depends_on:
      timescale-postgis-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # 5. Celery Worker (Background Audio, Trend & Outbreak Jobs)
  # -------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arogya_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: timescale-postgis-db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/app
    depends_on:
      timescale-postgis-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
  minio_data:
