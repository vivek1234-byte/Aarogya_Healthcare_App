<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArogyaSaathi (आरोग्य साथी) • Next-Gen Frontline Clinical AI</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4)); }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 28px rgba(16, 185, 129, 0.8)); }
    }
    @keyframes pulseRedGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.5)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.9)); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, 30px) scale(1.12); }
    }
    @keyframes scanline {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.2; }
    }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      70% { transform: scale(1.02) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-bounce-in {
      animation: bounceIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pulse-glow-green {
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .pulse-glow-red {
      animation: pulseRedGlow 2s infinite ease-in-out;
    }
    .orb-1 {
      animation: floatOrb1 14s infinite ease-in-out;
    }
    .orb-2 {
      animation: floatOrb2 16s infinite ease-in-out;
    }
    .radar-sweep-arm {
      transform-origin: center center;
      animation: radarSweep 4s linear infinite;
    }
    .scan-line {
      animation: scanline 1.5s ease-in-out infinite;
    }
    .glass-card {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen p-2 sm:p-6 transition-colors duration-300 relative overflow-x-hidden selection:bg-emerald-500 selection:text-white">

  <!-- Ambient Dynamic Animated Background Canvas -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <!-- Ambient Gradient Mesh Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-emerald-500/15 dark:bg-emerald-500/20 blur-3xl orb-1"></div>
    <div class="absolute top-1/3 -right-32 w-[32rem] h-[32rem] rounded-full bg-teal-500/15 dark:bg-teal-500/20 blur-3xl orb-2"></div>
    <div class="absolute -bottom-32 left-1/4 w-[28rem] h-[28rem] rounded-full bg-blue-500/15 dark:bg-blue-600/15 blur-3xl orb-1"></div>
    <!-- Subtle Grid Overlay -->
    <div class="absolute inset-0 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:32px_32px] opacity-[0.07]"></div>
  </div>

  <!-- Global Application Wrapper -->
  <div class="max-w-5xl mx-auto relative z-10">

    <!-- Top Master Controls Header -->
    <header class="glass-card bg-slate-800/80 dark:bg-slate-900/80 border border-slate-700/60 dark:border-slate-800 rounded-2xl p-4 mb-4 shadow-xl flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Facility -->
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-lg shadow-emerald-500/25">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-emerald-400 font-black text-xl">
            ⚕️
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-black text-lg text-white tracking-tight">ArogyaSaathi <span class="text-emerald-400 text-sm font-bold">(आरोग्य साथी)</span></h1>
            <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">DPDP 2023 AES-256</span>
          </div>
          <p id="appBarSubtitle" class="text-xs text-slate-400 font-medium">Rampur Sub-Centre • Frontline Decision Gateway</p>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="flex items-center gap-2.5">
        
        <!-- Current User Profile Chip (Shown when logged in) -->
        <div id="userProfileChip" class="hidden items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-700/60 border border-slate-600/50 text-xs">
          <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-xs font-bold text-white shadow-xs" id="userAvatarText">S</div>
          <div>
            <div id="userNameText" class="font-bold text-white leading-tight">Sunita Sharma</div>
            <div id="userRoleText" class="text-[10px] text-emerald-400 font-semibold">ASHA Worker</div>
          </div>
          <button onclick="logoutUser()" class="ml-1 text-slate-400 hover:text-red-400 p-1" title="Logout / Switch User">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>

        <!-- 108 Emergency SOS Trigger -->
        <button onclick="triggerEmergency108()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold text-xs shadow-lg shadow-red-600/30 transition-transform active:scale-95">
          <svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          <span>108 SOS</span>
        </button>

        <!-- Viewport Responsive Frame Toggle -->
        <div class="bg-slate-950/70 p-1 rounded-xl flex items-center border border-slate-700/70 text-xs font-bold">
          <button id="btnPhoneView" onclick="setDeviceMode('phone')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white shadow-xs transition-all">
            📱 Phone
          </button>
          <button id="btnTabletView" onclick="setDeviceMode('tablet')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">
            💻 Tablet
          </button>
        </div>

        <!-- Light / Dark Theme Switcher -->
        <button onclick="toggleAppTheme()" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-white shadow-sm transition-transform active:scale-90" title="Toggle Theme">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main Mobile/Tablet Device Container -->
    <div id="deviceContainer" class="mx-auto transition-all duration-300 w-full max-w-[420px]">
      <div class="glass-card bg-slate-950/90 border-2 border-slate-800 rounded-[36px] shadow-2xl shadow-emerald-950/20 overflow-hidden flex flex-col h-[760px] relative">

        <!-- Mobile Status Bar Simulation -->
        <div class="bg-slate-950/95 px-6 py-2 border-b border-slate-800/80 flex justify-between items-center text-[11px] text-slate-400 font-semibold tracking-wider">
          <span id="statusClock">09:41</span>
          <div class="flex items-center gap-2">
            <span class="text-emerald-400">● 5G NR</span>
            <span>📶</span>
            <span>🔋 96%</span>
          </div>
        </div>

        <!-- Main Screen Body Container (Scrollable) -->
        <div id="screenContent" class="flex-1 overflow-y-auto hide-scrollbar p-4 bg-slate-950/60 text-slate-100">
          <!-- Dynamically Injected Screen Content -->
        </div>

        <!-- Modern Bottom Navigation Bar (Hidden on Login Screen) -->
        <nav id="bottomNavBar" class="bg-slate-950/95 border-t border-slate-800/80 px-2 py-2 flex justify-around items-center">
          <button onclick="switchTab('home')" id="tabHome" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-emerald-400 font-black text-[11px] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Home</span>
          </button>
          <button onclick="switchTab('triage')" id="tabTriage" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-slate-400 hover:text-slate-200 font-medium text-[11px] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
            <span>Triage</span>
          </button>
          <button onclick="switchTab('chronic')" id="tabChronic" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-slate-400 hover:text-slate-200 font-medium text-[11px] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            <span>Vitals</span>
          </button>
          <button onclick="switchTab('roster')" id="tabRoster" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-slate-400 hover:text-slate-200 font-medium text-[11px] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span>Roster</span>
          </button>
          <button onclick="switchTab('outbreak')" id="tabOutbreak" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-slate-400 hover:text-slate-200 font-medium text-[11px] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
            <span>Outbreak</span>
          </button>
        </nav>

      </div>
    </div>

  </div>

  <!-- Interactive Toast Notification -->
  <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 max-w-sm glass-card bg-slate-900/95 text-white p-4 rounded-2xl shadow-2xl border border-slate-700 flex items-start gap-3">
    <div id="toastIcon" class="text-emerald-400 text-xl font-bold">✓</div>
    <div>
      <div id="toastTitle" class="font-extrabold text-sm">Action Complete</div>
      <div id="toastMessage" class="text-xs text-slate-300 mt-0.5">Notification description.</div>
    </div>
  </div>

  <script>
    // App State Management
    let isAuthenticated = false;
    let currentUser = {
      name: 'Sunita Sharma',
      role: 'ASHA Worker',
      id: 'ASHA-RAMPUR-7821',
      village: 'Rampur Village'
    };

    let currentTab = 'login'; // 'login', 'home', 'triage', 'chronic', 'roster', 'outbreak', 'register'
    let isDarkMode = true;
    let isTablet = false;

    // Triage State (NO CHATBOT)
    let isRecordingTriage = false;
    let activeSymptoms = [];
    let dangerSignAlert = false;
    let guidedQuestion = null;
    let micWaveInterval = null;

    // Chronic Care State
    let completedRosterIds = new Set();
    let currentRosterFilter = 'ALL';

    // RRT Checklist State
    let checkedRrtTasks = new Set([0, 1]);

    // Patient Register State
    let isRecordingConsent = false;
    let hasVoiceConsent = false;

    // Initialization
    function init() {
      // Clock timer
      setInterval(() => {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const clockEl = document.getElementById('statusClock');
        if (clockEl) clockEl.innerText = `${hrs}:${mins}`;
      }, 1000);

      renderScreen();
    }

    function toggleAppTheme() {
      isDarkMode = !isDarkMode;
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (isDarkMode) {
        html.classList.add('dark');
        html.classList.remove('light');
        document.body.className = 'bg-slate-950 text-slate-100 antialiased min-h-screen p-2 sm:p-6 transition-colors duration-300 relative overflow-x-hidden';
        icon.innerText = '🌙';
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        document.body.className = 'bg-slate-100 text-slate-900 antialiased min-h-screen p-2 sm:p-6 transition-colors duration-300 relative overflow-x-hidden';
        icon.innerText = '☀️';
      }
      renderScreen();
    }

    function setDeviceMode(mode) {
      const container = document.getElementById('deviceContainer');
      const btnPhone = document.getElementById('btnPhoneView');
      const btnTablet = document.getElementById('btnTabletView');
      if (mode === 'tablet') {
        isTablet = true;
        container.classList.remove('max-w-[420px]');
        container.classList.add('max-w-[780px]');
        btnTablet.className = 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white shadow-xs transition-all';
        btnPhone.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all';
      } else {
        isTablet = false;
        container.classList.remove('max-w-[780px]');
        container.classList.add('max-w-[420px]');
        btnPhone.className = 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white shadow-xs transition-all';
        btnTablet.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all';
      }
      renderScreen();
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['home', 'triage', 'chronic', 'roster', 'outbreak'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (btn) {
          if (t === tab) {
            btn.className = 'flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-emerald-400 font-black text-[11px] transition-all scale-105';
          } else {
            btn.className = 'flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-slate-400 hover:text-slate-200 font-medium text-[11px] transition-all';
          }
        }
      });
      renderScreen();
    }

    function showToast(title, message, isAlert = false) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastMessage').innerText = message;
      document.getElementById('toastIcon').innerText = isAlert ? '⚠️' : '✓';
      document.getElementById('toastIcon').className = isAlert ? 'text-red-400 text-xl font-bold' : 'text-emerald-400 text-xl font-bold';
      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3200);
    }

    function triggerEmergency108() {
      alert("🚨 PRIORITY 108 AMBULANCE DISPATCH\n\nGPS Coordinates Transmitted: 25.3210° N, 82.9812° E (Rampur)\n• Patient Pseudonym: HASH-RAMPUR-101\n• Suspected Diagnosis: Acute Coronary Syndrome\n• Ambulance ETA: 12 minutes");
    }

    function logoutUser() {
      isAuthenticated = false;
      currentTab = 'login';
      document.getElementById('userProfileChip').classList.add('hidden');
      document.getElementById('userProfileChip').classList.remove('flex');
      document.getElementById('bottomNavBar').classList.add('hidden');
      renderScreen();
      showToast('Logged Out', 'Securely logged out from ASHA gateway.');
    }

    function loginUser(name, role, id, village) {
      currentUser = { name, role, id, village };
      isAuthenticated = true;
      currentTab = 'home';

      // Update Top Profile Bar
      const profileChip = document.getElementById('userProfileChip');
      profileChip.classList.remove('hidden');
      profileChip.classList.add('flex');
      document.getElementById('userNameText').innerText = name;
      document.getElementById('userRoleText').innerText = role;
      document.getElementById('userAvatarText').innerText = name.charAt(0);
      document.getElementById('appBarSubtitle').innerText = `${village} • ${role} Active`;

      document.getElementById('bottomNavBar').classList.remove('hidden');

      showToast('Authentication Successful', `Welcome, ${name}! AES-256 session established.`);
      renderScreen();
    }

    function renderScreen() {
      const el = document.getElementById('screenContent');
      if (currentTab === 'login') {
        document.getElementById('bottomNavBar').classList.add('hidden');
        el.innerHTML = renderLoginScreen();
      } else {
        document.getElementById('bottomNavBar').classList.remove('hidden');
        if (currentTab === 'home') el.innerHTML = renderHomeScreen();
        else if (currentTab === 'triage') el.innerHTML = renderTriageScreen();
        else if (currentTab === 'chronic') el.innerHTML = renderChronicScreen();
        else if (currentTab === 'roster') el.innerHTML = renderRosterScreen();
        else if (currentTab === 'outbreak') el.innerHTML = renderOutbreakScreen();
        else if (currentTab === 'register') el.innerHTML = renderRegisterScreen();
      }
    }

    // -------------------------------------------------------------
    // SCREEN 1: MODERN ANIMATED LOGIN SCREEN (EXTREME GRAPHICS)
    // -------------------------------------------------------------
    function renderLoginScreen() {
      return `
        <div class="h-full flex flex-col justify-center animate-bounce-in py-2">
          
          <!-- Animated Brand Logo Emblem -->
          <div class="text-center mb-6">
            <div class="relative inline-block">
              <!-- Outer Glowing Pulse Ring -->
              <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-emerald-600 via-teal-500 to-cyan-400 p-1 pulse-glow-green mx-auto flex items-center justify-center shadow-2xl shadow-emerald-500/40">
                <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-3xl">
                  🩺
                </div>
              </div>
            </div>
            <h2 class="text-2xl font-black text-white mt-3 tracking-tight">ArogyaSaathi Gateway</h2>
            <p class="text-xs text-emerald-400 font-semibold tracking-wide">Digital Personal Data Protection (DPDP) Act 2023</p>
          </div>

          <!-- Glassmorphic Auth Box -->
          <div class="glass-card bg-slate-900/85 border border-slate-700/80 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
            
            <!-- Quick Demo Profile Selector -->
            <div class="mb-4">
              <span class="text-[11px] font-black uppercase tracking-wider text-slate-400 block mb-2">Select Frontline Clinical Role:</span>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="loginUser('Sunita Sharma', 'ASHA Worker', 'ASHA-RAMPUR-7821', 'Rampur Village')" class="p-2 rounded-xl bg-emerald-950/60 border border-emerald-500/50 hover:bg-emerald-900/60 text-left transition-all group">
                  <div class="text-base group-hover:scale-110 transition-transform">👩‍⚕️</div>
                  <div class="font-extrabold text-[11px] text-emerald-300 mt-1 leading-tight">Sunita (ASHA)</div>
                  <div class="text-[9px] text-slate-400">Village Rampur</div>
                </button>

                <button onclick="loginUser('Dr. Rajesh Verma', 'Medical Officer', 'MO-PHC-4091', 'Rampur PHC')" class="p-2 rounded-xl bg-blue-950/60 border border-blue-500/50 hover:bg-blue-900/60 text-left transition-all group">
                  <div class="text-base group-hover:scale-110 transition-transform">🩺</div>
                  <div class="font-extrabold text-[11px] text-blue-300 mt-1 leading-tight">Dr. Rajesh (MO)</div>
                  <div class="text-[9px] text-slate-400">PHC Centre</div>
                </button>

                <button onclick="loginUser('Pooja Singh', 'ANM Specialist', 'ANM-SUB-3105', 'Shivpur Sub-centre')" class="p-2 rounded-xl bg-purple-950/60 border border-purple-500/50 hover:bg-purple-900/60 text-left transition-all group">
                  <div class="text-base group-hover:scale-110 transition-transform">💉</div>
                  <div class="font-extrabold text-[11px] text-purple-300 mt-1 leading-tight">Pooja (ANM)</div>
                  <div class="text-[9px] text-slate-400">Sub-centre</div>
                </button>
              </div>
            </div>

            <!-- Custom Credentials Form -->
            <div class="space-y-3">
              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">Healthcare Worker ID / Mobile</label>
                <div class="relative">
                  <input id="loginWorkerId" type="text" value="ASHA-RAMPUR-7821" class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-xs font-semibold text-white placeholder-slate-500 outline-none transition-all" />
                  <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🆔</span>
                </div>
              </div>

              <div>
                <label class="text-[11px] font-bold text-slate-400 block mb-1">Security PIN / Password</label>
                <div class="relative">
                  <input id="loginPin" type="password" value="1234" class="w-full pl-9 pr-10 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-xs font-semibold text-white placeholder-slate-500 outline-none transition-all" />
                  <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔒</span>
                  <button type="button" onclick="const p=document.getElementById('loginPin'); p.type = p.type==='password'?'text':'password';" class="absolute right-3 top-2.5 text-slate-500 text-xs hover:text-white">👁️</button>
                </div>

          showToast('Consent Captured', 'Verbal voice signature stored with SHA-256 integrity hash.');
